<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeBook</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;background:#f7f7f8;color:#1c1c1e;display:flex;min-height:100vh;align-items:center;justify-content:center}
  .card{max-width:560px;padding:48px 36px;background:#fff;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.06);text-align:center}
  h1{margin:0 0 8px;font-size:30px;letter-spacing:.5px}
  p{margin:8px 0;color:#555;line-height:1.7}
  .links{margin-top:28px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .links a{display:inline-block;padding:11px 22px;border-radius:10px;background:#0a84ff;color:#fff;text-decoration:none;font-weight:600;font-size:15px}
  .links a.secondary{background:#e9e9eb;color:#0a84ff}
  footer{margin-top:30px;font-size:13px;color:#999}
  footer p{margin:0;color:inherit}
  .filing{margin-top:10px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px 16px}
  .filing a{display:inline-flex;align-items:center;gap:5px;padding:0;color:inherit;text-decoration:none;font-weight:400;white-space:nowrap}
  .filing a:hover{text-decoration:underline}
  .filing img{width:auto;height:16px;object-fit:contain}
  @media (prefers-color-scheme:dark){body{background:#000;color:#f2f2f7}.card{background:#1c1c1e;box-shadow:none}p{color:#aeaeb2}footer{color:#8e8e93}.links a.secondary{background:#2c2c2e}}
</style>
</head>
<body>
  <main class="card">
    <h1>HomeBook</h1>
    <p>欢迎访问 HomeBook 官方网站。</p>
    <p>本站为 HomeBook iOS 应用提供隐私政策与支持服务。</p>
    <div class="links">
      <a href="/terms.html">用户协议</a>
      <a class="secondary" href="/privacy.html">隐私政策</a>
      <a class="secondary" href="/support.html">支持 / Support</a>
    </div>
    <footer>
      <p>© 2026 HomeBook. All rights reserved.</p>
      <div class="filing">
        <a href="https://beian.mps.gov.cn/#/query/webSearch" target="_blank" rel="noreferrer"><img src="/beian-logo.png" alt="">赣公网安备36103002000191号</a>
        <a href="https://beian.miit.gov.cn/#/Integrated/index" target="_blank" rel="noreferrer">浙ICP备2026054011号-1</a>
      </div>
    </footer>
  </main>
</body>
</html>
